[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "three-feet"
version = "0.1.0"
description = "Space-heater clearance helper: phone camera + Meta SAM 3.1 / Muse Spark / Muse Wonder + smart-plug OFF requests."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "meta-sam-parser>=0.1.0",
    "openai>=1.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-contrib-python>=4.8",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
cync = ["pycync>=0.6"]

[tool.setuptools.packages.find]
include = ["three_feet_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
